<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Prueba de avisos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-button (click)="activate()">Activar avisos</ion-button>
  <p><strong>Estado:</strong> {{ status() }}</p>

  @if (token()) {
  <p><strong>Token de este dispositivo</strong> (solo para la prueba, no lo compartas):</p>
  <p style="word-break: break-all; font-family: monospace; font-size: 12px">{{ token() }}</p>
  } @if (lastMessage()) {
  <p><strong>Último aviso con la página abierta:</strong> {{ lastMessage() }}</p>
  }
</ion-content>
