@if (signedIn() && !ownHeader()) {
<ion-header>
  <ion-toolbar class="navbar">
    <nav class="navbar-content" aria-label="Menú principal">
      <a class="brand" routerLink="/tabs/inicio" aria-label="Inicio">
        <img src="assets/icon/logo.png" alt="" />
        <span class="brand-name">ELVA Gestión</span>
      </a>
      <div class="links">
        <a routerLink="/tabs/inicio" routerLinkActive="active" ariaCurrentWhenActive="page">Inicio</a>
        <a routerLink="/tabs/vacaciones" routerLinkActive="active" ariaCurrentWhenActive="page">Vacaciones</a>
        <a routerLink="/tabs/horas-extra" routerLinkActive="active" ariaCurrentWhenActive="page">Horas extra</a>
        <a routerLink="/tabs/reporte" routerLinkActive="active" ariaCurrentWhenActive="page">Mi reporte</a>
        <a routerLink="/tabs/solicitudes" routerLinkActive="active" ariaCurrentWhenActive="page">Mis solicitudes</a>
        <a routerLink="/tabs/avisos" routerLinkActive="active" ariaCurrentWhenActive="page">
          Avisos @if (unseenNotices() > 0) {
          <span class="badge" [attr.aria-label]="unseenNotices() + ' avisos nuevos'">{{ unseenNotices() }}</span>
          }
        </a>
        @if (isAdmin()) {
        <a routerLink="/tabs/dashboard">Panel de administración</a>
        }
      </div>
      @if (notifyState() === 'off') {
      <button type="button" class="notify" (click)="enableNotifications()">Activar notificaciones</button>
      }
      <button type="button" class="logout" (click)="logout()">Cerrar sesión</button>
    </nav>
  </ion-toolbar>
</ion-header>
}

<ion-tabs></ion-tabs>
<app-notification-cards />
